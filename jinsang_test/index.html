<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진상도감 인터랙티브</title>
    <style>
        :root {
            --primary-color: #7c4dff;
            --bg-color: #f4f6fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --btn-bg: #f8f9fa;
            --btn-border: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-width-container {
            width: 100%;
            max-width: 420px;
            min-height: 80vh;
            margin-top: 20px;
        }

        .box-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            text-align: center;
            box-sizing: border-box;
        }

        .image-box {
            width: 100%;
            margin: 24px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .result-image-box {
            width: 150px;
            height: 320px;
            margin: 16px auto 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .result-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .badge {
            display: inline-block;
            background: #ede7f6;
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .title-text {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;
            margin: 0 0 10px 0;
            word-break: keep-all;
        }

        .question-box {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 28px;
            border-left: 4px solid var(--primary-color);
            text-align: left;
        }

        .question-box h3 {
            margin: 0;
            font-size: 17px;
            color: var(--text-main);
            line-height: 1.6;
            font-weight: 700;
            word-break: keep-all;
        }

        .sub-text {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
            word-break: keep-all;
        }

        .quiz-btn {
            display: block;
            width: 100%;
            min-height: 72px;
            margin-bottom: 12px;
            padding: 16px 20px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14.5px;
            color: var(--text-main);
            text-align: left;
            line-height: 1.6;
            transition: all 0.2s;
            box-shadow: none;
            box-sizing: border-box;
            word-break: keep-all;
        }

        .quiz-btn:hover {
            background: #f1f2f6;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .main-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .result-sub {
            color: var(--primary-color);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .result-desc-box {
            text-align: left;
            background: #fdfdfd;
            border: 1px solid #f1f2f6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .result-desc-paragraph {
            color: #4f5f6f;
            font-size: 14.5px;
            line-height: 1.7;
            margin: 0 0 16px 0;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 24px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 6px;
            transition: width 0.05s linear;
        }
    </style>
</head>
<body>
    <div class="app-width-container">
        
        <div id="intro-container" class="box-container">
            <span class="badge">진상 대처 유형 테스트</span>
            <h2 class="title-text">내가 고깃집 알바라면?</h2>
            <p class="sub-text">
                익명A 님의 사연으로 알아보는 나의 진상 대처 유형<br>
                <span style="font-size: 13px; color: #95a5a6;">(진상 대처로 보는 나의 멘탈 성격 유형)</span>
            </p>
            <div class="image-box">
                <img src="character.png" alt="알바생 캐릭터들">
            </div>
            <button class="main-btn" onclick="startTest()">시작하기</button>
        </div>

        <div id="quiz-container" class="box-container" style="display: none;">
            <div id="question-number" class="badge"></div>
            <div class="question-box">
                <h3 id="question-text"></h3>
            </div>
            <div id="answer-buttons"></div>
        </div>

        <div id="loading-container" class="box-container" style="display: none; padding: 50px 24px;">
            <h3 class="title-text">알바 멘탈 분석 중...</h3>
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="result-container" class="box-container" style="display: none;">
            <p id="result-subtitle" class="result-sub"></p>
            <h1 id="result-title" class="title-text" style="font-size: 26px; margin-bottom: 16px;"></h1>
            
            <div class="result-image-box">
                <img id="result-character-image" src="" alt="유형별 캐릭터 결과">
            </div>
            
            <div id="result-desc-container" class="result-desc-box"></div>
            <button class="main-btn" onclick="goToIntro()">처음으로</button>
        </div>

    </div>
    <script src="quiz.js"></script>
</body>
</html>
