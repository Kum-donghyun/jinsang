name: NCP 자동 배포 (CI/CD)

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🛎️ 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 📦 Node.js 환경 설정
      uses: actions/setup-node@v3
      with:
        node-version: '18.x' # NCP 서버와 동일한 버전 권장

    - name: 🛠️ 프론트엔드(Client) 빌드
      run: |
        cd client
        npm install
        npm run build

    - name: 🚀 빌드 파일 및 서버 코드 NCP로 전송 (SCP)
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PUBLIC_HOST }}
        username: ${{ secrets.PUBLIC_USER }}
        key: ${{ secrets.PUBLIC_SSH_KEY }}
        port: 22
        source: "client/build/*,server/*"
        target: "${{ secrets.PRIVATE_APP_DIR }}"
        strip_components: 0

    - name: 🔄 백엔드(Server) 패키지 설치 및 PM2 재시작
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PUBLIC_HOST }}
        username: ${{ secrets.PUBLIC_USER }}
        key: ${{ secrets.PUBLIC_SSH_KEY }}
        port: 22
        script: |
          cd ${{ secrets.PRIVATE_APP_DIR }}/server
          npm install --production
          pm2 reload ecosystem.config.js || pm2 start ecosystem.config.js
