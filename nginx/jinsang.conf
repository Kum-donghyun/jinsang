server {
    listen 80;
    server_name _;  # 공인 IP 또는 도메인으로 접속 시 모두 허용

    # ── 리액트 클라이언트 정적 파일 서빙 ────────────────────────
    root /root/jinsang-dogam/client/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # React Router 새로고침 404 방지
    }

    # ── Node.js 백엔드 API 프록시 ─────────────────────────────
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── 업로드 파일 서빙 ─────────────────────────────────────
    location /uploads/ {
        alias /root/jinsang-dogam/server/uploads/;
    }
}
